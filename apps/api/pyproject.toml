[project]
name = "dataproof-api"
version = "0.1.0"
description = "DataProof API - Scientific data analysis and interpretation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "redis>=5.1.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "minio>=7.2.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "celery>=5.4.0",
    "plotly>=5.24.0",
    "kaleido>=0.2.1",
    "jinja2>=3.1.0",
    "weasyprint>=62.0",
    "python-docx>=1.1.0",
    "passlib[argon2]>=1.7.4",
    "pyjwt>=2.8.0",
    "stripe>=7.0.0",
    "sentry-sdk>=2.0.0",
    "email-validator>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "TCH"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["src/api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
